<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
  header { padding: 20px; border-bottom: 1px solid var(--border); text-align: center; }
  header a { color: var(--accent); text-decoration: none; font-weight: bold; font-size: 18px; }
  main { max-width: 800px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 2rem; margin-bottom: 30px; color: #fff; text-align: center; }
  ul { list-style: none; padding: 0; }
  li { margin-bottom: 15px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; transition: transform 0.2s; }
  li:hover { transform: translateX(5px); border-color: var(--accent); }
  a { display: block; padding: 15px 20px; color: var(--text); text-decoration: none; font-weight: 500; }
  a:hover { color: var(--accent); }
  footer { text-align: center; padding: 20px; border-top: 1px solid var(--border); margin-top: 40px; font-size: 13px; color: var(--muted); }
  footer a { color: var(--muted); text-decoration: none; margin: 0 10px; display: inline; padding: 0; }
  footer a:hover { color: var(--accent); }
</style>
</head>
